<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Time</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f4f4f4;
        }

        .clock {
            text-align: center;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #time {
            font-size: 3rem;
            color: #0078d4;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="clock">
        <h1><i>Current Time</i></h1>
        <div id="time"></div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById("time").textContent =
                now.toLocaleTimeString();
        }

        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
